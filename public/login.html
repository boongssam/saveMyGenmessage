<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>쪽지보관함</title>
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
  <main class="login-card">
    <img src="/icon.svg" alt="" class="login-icon">
    <h1>쪽지보관함</h1>
    <p class="login-sub" id="sub">Gen Messenger 쪽지를 이 PC에 보관합니다.</p>
    <form id="form" autocomplete="off">
      <label for="pw" id="pwLabel">비밀번호</label>
      <input id="pw" type="password" required minlength="4" autofocus>
      <div id="confirmRow" hidden>
        <label for="pw2">비밀번호 확인</label>
        <input id="pw2" type="password" minlength="4">
      </div>
      <p class="form-error" id="err" role="alert"></p>
      <button type="submit" class="btn btn-primary btn-block" id="submit">열기</button>
    </form>
    <p class="login-note">보관된 쪽지는 이 PC 안에만 저장되며 인터넷으로 전송되지 않습니다.</p>
  </main>
  <footer class="site-footer">
    <p>쪽지보관함 v1.0 · 제작 교사 김대붕</p>
    <p>오류·문의: <a href="tel:010-6676-8686">010-6676-8686</a></p>
    <p>© 2026 하남중앙초등학교 교사 김대붕. 이 프로그램은 교직원의 개인 업무용으로 무료 사용할 수 있으며,
      제작자의 허락 없이 수정·재배포하거나 판매할 수 없습니다.</p>
  </footer>
  <script src="/login.js"></script>
</body>
</html>
